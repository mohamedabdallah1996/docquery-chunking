[project]
name = "docquery-chunking"
version = "0.1.0"
description = "Splits a ParsedDocument into header-aware, retrieval-sized chunks"
readme = "README.md"
authors = [
    { name = "Mohamed Abdullah", email = "mohamed.abdullah9618@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docquery-core",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.2",
    "langchain-text-splitters>=0.3.0",
    "tiktoken>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
docquery-core = { git = "https://github.com/mohamedabdallah1996/docquery-core" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
